[platformio]
default_envs = heltec_v3_lora_test

; ── Shared settings ──────────────────────────────────────────────────────────
[common]
framework = arduino
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200

; ── Heltec LoRa32 v2 — WiFi mode (bench testing) ────────────────────────────
[env:heltec_wifi]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = ${common.framework}
lib_deps =
    ${common.lib_deps}
    arduino-libraries/NTPClient@^3.2.1
build_flags =
    -D WIFI_MODE
    -D BOARD_HELTEC_V2
monitor_speed = ${common.monitor_speed}

; ── Heltec LoRa32 v2 — LoRa mode (production) ───────────────────────────────
[env:heltec_lora]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = ${common.framework}
lib_deps =
    ${common.lib_deps}
    jgromes/RadioLib@^7.1.2
build_flags =
    -D LORA_MODE
    -D BOARD_HELTEC_V2
monitor_speed = ${common.monitor_speed}

; ── TTGO LoRa32 v1 — WiFi mode ───────────────────────────────────────────────
[env:ttgo_wifi]
platform = espressif32
board = ttgo-lora32-v1
framework = ${common.framework}
lib_deps =
    ${common.lib_deps}
    arduino-libraries/NTPClient@^3.2.1
build_flags =
    -D WIFI_MODE
    -D BOARD_TTGO_V1
monitor_speed = ${common.monitor_speed}

; ── TTGO LoRa32 v1 — LoRa mode ───────────────────────────────────────────────
[env:ttgo_lora]
platform = espressif32
board = ttgo-lora32-v1
framework = ${common.framework}
lib_deps =
    ${common.lib_deps}
    jgromes/RadioLib@^7.1.2
build_flags =
    -D LORA_MODE
    -D BOARD_TTGO_V1
monitor_speed = ${common.monitor_speed}

; ── Test environments — fake data over LoRa, no ADS1115 needed ───────────────
[env:heltec_v3_lora_test]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = ${common.framework}
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.1.2
build_flags =
    -D LORA_MODE
    -D BOARD_HELTEC_V3
    -D TEST_MODE
monitor_speed = ${common.monitor_speed}

[env:heltec_lora_test]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = ${common.framework}
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.1.2
build_flags =
    -D LORA_MODE
    -D BOARD_HELTEC_V2
    -D TEST_MODE
monitor_speed = ${common.monitor_speed}

[env:ttgo_lora_test]
platform = espressif32
board = ttgo-lora32-v1
framework = ${common.framework}
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.1.2
build_flags =
    -D LORA_MODE
    -D BOARD_TTGO_V1
    -D TEST_MODE
monitor_speed = ${common.monitor_speed}
